services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dgx
    gpus:
      - driver: nvidia
        device_ids:
          - ${DGX_GPU_DEVICE:-0}
        capabilities:
          - gpu
    init: true
    restart: unless-stopped
    shm_size: "8gb"
    ipc: host
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      MODEL_DEVICE: ${MODEL_DEVICE:-cuda}
      MODEL_PATH: ${MODEL_PATH:-/models/exp04_pseudo_ir_aug.pth}
      AIHUB_MODEL_PATH: ${AIHUB_MODEL_PATH:-/models/final_model.pth}
      DRIVER4_MODEL_PATH: ${DRIVER4_MODEL_PATH:-/models/final_model_0528.pth}
      DGX_GPU_DEVICE: ${DGX_GPU_DEVICE:-0}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
      CUDA_DEVICE_ORDER: ${CUDA_DEVICE_ORDER:-PCI_BUS_ID}
      OMP_NUM_THREADS: ${OMP_NUM_THREADS:-4}
      MKL_NUM_THREADS: ${MKL_NUM_THREADS:-4}
      TORCH_NUM_THREADS: ${TORCH_NUM_THREADS:-4}
      TORCH_COMPILE_BACKEND: ${TORCH_COMPILE_BACKEND:-inductor}
      TORCH_COMPILE_MODE: ${TORCH_COMPILE_MODE:-reduce-overhead}
    ulimits:
      memlock:
        soft: -1
        hard: -1
      stack: 67108864
